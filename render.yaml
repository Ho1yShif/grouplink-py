# Blueprint for everything except the Workflow: the web service that serves the
# page and receives Notion's webhook, and the Key Value instance that holds the
# published site and caches scraped metadata. Blueprints don't support Workflows
# yet, so create the Workflow service in the Dashboard and set its env vars there,
# including REDIS_URL, copied from this Key Value instance's internal connection
# string.
#
# Order: apply this Blueprint, create the Workflow, then set WORKFLOW_SLUG.
projects:
  - name: grouplink
    environments:
      - name: production
        services:
          # Serves each profile's page from the snapshot in Key Value. Notion posts
          # here on every edit; the receiver debounces and starts one
          # grouplink.rebuild run. On the starter plan so it is always on — a free
          # instance spins down after 15 minutes idle, and this is the only trigger.
          - type: web
            name: grouplink-webhook-py
            runtime: python
            plan: starter
            region: oregon
            # Render's Python image does not ship uv, so the build installs from
            # requirements.txt, which `uv export` regenerates.
            buildCommand: pip install -r requirements.txt
            startCommand: python -m grouplink.webhook
            healthCheckPath: /healthz
            # One instance. The debounce timer and the missing-key retry live in
            # memory, so a second instance would start duplicate runs.
            numInstances: 1
            autoDeployTrigger: commit
            envVars:
              - key: RENDER_API_KEY
                sync: false
              - key: WORKFLOW_SLUG
                sync: false
              # Verification token of the Notion subscription. Unset until the
              # handshake lands; see the README.
              - key: NOTION_WEBHOOK_SECRET
                sync: false
              - key: DISPATCH_TOKEN
                generateValue: true
              - key: REBUILD_TASK
                value: grouplink.rebuild
              - key: DEBOUNCE_MS
                value: "60000"
              # The web service reads the published site from here.
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: grouplink-cache
                  property: connectionString

          - type: keyvalue
            name: grouplink-cache
            plan: starter
            region: oregon
            # volatile-lru evicts only keys with a TTL. The scraped metadata has one;
            # grouplink:site, the published site, does not, so it is never evicted.
            maxmemoryPolicy: volatile-lru
            # Private network only. The Workflow and the web service reach it over
            # the internal URL.
            ipAllowList: []
