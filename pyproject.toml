[project]
name = "grouplink"
version = "0.1.0"
description = "Render's links page, rebuilt from Notion by a Render Workflow and deployed as a static site."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "render==1.0.1",
    "render-lab-tasks-core==0.1.1",
    "render-lab-tasks-notion==0.1.0",
    "render-lab-tasks-scrape==0.1.0",
    "render-lab-tasks-render-kv==0.1.0",
    "render-lab-tasks-http==0.1.0",
    "render-lab-tasks-github==0.1.1",
    "render-lab-tasks-render==0.1.0",
    "render-lab-tasks-slack==0.1.1",
    "render-lab-triggers==0.1.0",
]

[dependency-groups]
dev = [
    "render-lab-test-utils==0.1.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-socket>=0.7",
    "ruff>=0.9",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grouplink"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The CSS block and the document template are byte-identical copies of the
# TypeScript ones. Rewrapping either changes the committed page.
"grouplink/page.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["grouplink", "scripts", "tests"]

[[tool.mypy.overrides]]
# The composition harness fakes vendor ports with plain dicts and a duck-typed
# context, which is the point of the test. Annotating them to satisfy strict mode
# would mean restating every pack's TypedDict at the call site.
module = "tests.*"
disable_error_code = ["arg-type", "misc", "no-untyped-def", "type-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
